&lt;script&gt;
  const pieces = document.querySelector('#pieces');
  const spread = document.querySelector('#spread');
  const circle = document.querySelector('#circle');
  const row = document.querySelector('#row');
  const dimensions = document.querySelector('#dimensions');
  const namespace = 'http://www.w3.org/2000/svg';
  const radius = 90;
  const colors = ['#e6a552', '#64aaa1'];

  function sector(path, x, y, rotation, index) {
    const shape = document.createElementNS(namespace, 'path');
    shape.setAttribute('d', path);
    shape.setAttribute('transform', `translate(${x} ${y}) rotate(${rotation})`);
    shape.setAttribute('fill', colors[index % colors.length]);
    shape.setAttribute('stroke', '#fbfaf8');
    shape.setAttribute('stroke-width', '1');
    return shape;
  }

  function draw() {
    const count = Number(pieces.value);
    const progress = Number(spread.value) / 100;
    const angle = Math.PI / count;
    const halfBase = radius * Math.sin(angle);
    const height = radius * Math.cos(angle);
    const width = count * 2 * halfBase;
    const left = 780 - width / 2;
    const path = `M0 0 L${-halfBase} ${height} A${radius} ${radius} 0 0 0 ${halfBase} ${height} Z`;
    const circleSectors = [];
    const rowSectors = [];
    for (let index = 0; index &lt; count; index++) {
      const rotation = (index + 0.5) * 360 / count - 90;
      const targetX = left + (index + 0.5) * 2 * halfBase;
      circleSectors.push(sector(path, 190, 145, rotation, index));
      rowSectors.push(sector(path, 780 + (targetX - 780) * progress, 145 - 45 * progress, rotation * (1 - progress), index));
    }
    circle.replaceChildren(...circleSectors);
    row.replaceChildren(...rowSectors);
    document.querySelector('#piece-count').value = String(count);
    document.querySelector('#spread-value').value = `${spread.value}%`;
    dimensions.setAttribute('opacity', String(Math.max(0, (progress - 0.8) / 0.2)));
    document.querySelector('#base-dimension').setAttribute('d', `M${left} 210 v10 H${left + width} v-10`);
    document.querySelector('#height-dimension').setAttribute('d', `M${left + width + 8} 100 h10 v${radius} h-10`);
    document.querySelector('#height-label').setAttribute('x', String(left + width + 24));
    document.querySelector('#height-label').setAttribute('y', '152');
  }

  function setLanguage(language) {
    document.documentElement.lang = language;
    for (const element of document.querySelectorAll('[data-ja]')) element.textContent = element.dataset[language];
    for (const element of document.querySelectorAll('[data-aria-ja]')) element.setAttribute('aria-label', element.getAttribute(`data-aria-${language}`));
  }

  pieces.addEventListener('input', draw);
  spread.addEventListener('input', draw);
  addEventListener('message', event =&gt; {
    if (event.source !== parent || event.data?.type !== 'peitho-language') return;
    setLanguage(event.data.language === 'en' ? 'en' : 'ja');
  });
  draw();
&lt;/script&gt;
