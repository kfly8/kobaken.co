  <h1><span class="slot-title">6. ペアワイズ(Pairwise testing)</span></h1>
  <div class="body">
    <div class="slot-body"><ul>
<li>全組み合わせが困難なとき、<strong>パターンを削減する手法</strong></li>
<li>「任意の2因子の値の全組合せが最低1回出現」する組み合わせでテスト</li>
<li>バグの大半は、2〜3 要因の組み合わせで起きる</li>
<li><strong>あとからテスト強度を上げやすい</strong></li>
</ul>
