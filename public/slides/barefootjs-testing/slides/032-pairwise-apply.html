  <h1><span class="slot-title">BarefootJS のペアワイズ</span></h1>
  <figure class="code">
    <pre class="slot-code"><code>TSXを次の5因子に分解
- state: 値がどこから来て、書き換え可能かどうか。例 signal value, memo
- structure: 条件分岐(三項演算子)、ループ、ネストした子コンポーネントなど
- binding: signalの値がDOMのどこにどう結びつくか
- event: 何がハンドラを起動するか。click, input など
- callback: ハンドラの中身の形。単純なインラインのアロー関数</code></pre>
  </figure>
