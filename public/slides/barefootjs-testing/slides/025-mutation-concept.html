  <h1><span class="slot-title">3. メタモルフィックテスト(Metamorphic testing)</span></h1>
  <div class="body">
    <div class="slot-body"><ul>
<li>期待値が設定困難なときのテスト手法の一つ</li>
<li><strong>入力を変化させたとき</strong>、出力の変化の関係性をテストする</li>
<li>例: 入力を変化させても、出力は「変わらないはず」と書く</li>
</ul>
