  <h1><span class="slot-title">5. 差分テスト(Differential testing)</span></h1>
  <div class="body">
    <div class="slot-body"><ul>
<li>同じ入力を 2 つの実装に通し、出力の食い違いを見る手法</li>
<li>信頼できる実装（リファレンス）が、そのまま期待値になる</li>
<li>コンパイラや、複数の実装を持つソフトウェアに効く</li>
<li>適合性テストと違い、期待値は保存せず、その場で比較</li>
<li>疑似オラクルと違い、リファレンス側を「正」に固定する</li>
</ul>
</div>
