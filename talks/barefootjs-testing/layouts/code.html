<section class="peitho-slide layout-code">
  <header class="code-head">
    <h1><slot name="title" accepts="inline" arity="1"></slot></h1>
    <div class="code-caption slot-body-wrap">
      <slot name="body" accepts="blocks" arity="0..*"></slot>
    </div>
  </header>
  <figure class="code">
    <slot name="code" accepts="code" arity="1"></slot>
  </figure>
</section>
